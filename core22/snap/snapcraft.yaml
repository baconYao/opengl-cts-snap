name: baconyao-opengl-cts-22
base: core22
confinement: strict
lint:
  ignore:
    - metadata
platforms:
  amd64:
    build-on: [amd64]
  arm64:
    build-on: [amd64, arm64]
version: '4.6.6.0'
license: Apache-2.0
summary: Khronos OpenGL Conformance Test Suite
description: |
  Baseline snap for the Khronos OpenGL CTS. Builds the glcts
  test binary from source via CMake and ships an executable for running tests.

  The core22 variant, built against the toolchain and drivers in the 22.04
  archive.

plugs:
  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

apps:
  test:
    command: test
    plugs:
      - opengl
      - graphics-core22
  list-tests:
    command: list_tests
  eglinfo:
    command: eglinfo
    plugs:
      - opengl
      - graphics-core22

parts:
  test-conformance:
    source: bin/
    plugin: dump
    stage:
      - test

  list-tests:
    source: bin/
    plugin: dump
    stage:
      - list_tests

  eglinfo-wrapper:
    source: bin/
    plugin: dump
    stage:
      - eglinfo

  eglinfo-bin:
    plugin: nil
    override-pull: |
      set -eux
      if [ "$CRAFT_ARCH_BUILD_FOR" == "arm64" ] && [ "$CRAFT_ARCH_BUILD_ON" == "amd64" ]; then
          # Multiarch setup must happen at PULL time, before craftctl default
          # fetches stage-packages, or stage-packages get resolved from the
          # amd64 build host's native arch and end up staged as amd64 .debs
          # (usr/lib/x86_64-linux-gnu/*) even though build-for is arm64.
          dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          for f in /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64.list) continue ;;
            esac
            if ! grep -q "ubuntu-ports" "$f"; then
              sed -i 's/^deb /deb [arch=amd64] /' "$f"
            fi
          done
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if ! grep -q "ubuntu-ports" "$f"; then
              if grep -q "^Architectures:" "$f"; then
                sed -i 's/^Architectures:.*/Architectures: amd64/' "$f"
              else
                sed -i '/^URIs:/a Architectures: amd64' "$f"
              fi
            fi
          done
          printf '%s\n' \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update
      fi
      craftctl default
    stage-packages:
      - mesa-utils
      - mesa-utils-bin
      - libgl1
      - libegl1
      - libx11-6
      - libxcb1
      - libxext6
    stage:
      - usr/bin/eglinfo*

  gl-runtime-libs:
    plugin: nil
    override-pull: |
      set -eux
      if [ "$CRAFT_ARCH_BUILD_FOR" == "arm64" ] && [ "$CRAFT_ARCH_BUILD_ON" == "amd64" ]; then
          # Multiarch setup must happen at PULL time, before craftctl default
          # fetches stage-packages, or stage-packages get resolved from the
          # amd64 build host's native arch and end up staged as amd64 .debs
          # (usr/lib/x86_64-linux-gnu/*) even though build-for is arm64.
          dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          for f in /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64.list) continue ;;
            esac
            if ! grep -q "ubuntu-ports" "$f"; then
              sed -i 's/^deb /deb [arch=amd64] /' "$f"
            fi
          done
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if ! grep -q "ubuntu-ports" "$f"; then
              if grep -q "^Architectures:" "$f"; then
                sed -i 's/^Architectures:.*/Architectures: amd64/' "$f"
              else
                sed -i '/^URIs:/a Architectures: amd64' "$f"
              fi
            fi
          done
          printf '%s\n' \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update
      fi
      craftctl default
    stage-packages:
      # jammy predates the 64-bit time_t transition, so these are named
      # without the "t64" suffix used on later releases.
      - libpng16-16
      - libelf1
      - libzstd1
      - liblzma5
      - libdrm2
      - libexpat1
      - libstdc++6
      - libgcc-s1
      - zlib1g
      - libffi8
      - libpciaccess0
      - libbsd0
      - libmd0
      - libedit2
      - libtinfo6
      - libegl-dev

  opengl-cts:
    plugin: nil
    source: https://github.com/KhronosGroup/VK-GL-CTS.git
    source-tag: opengl-cts-$SNAPCRAFT_PROJECT_VERSION
    source-type: git
    build-packages:
      - build-essential
      - cmake
      - gcc-aarch64-linux-gnu
      - g++-aarch64-linux-gnu
      - python3-pip
      - meson
      - pkg-config
      - glslang-tools
      - libpng-dev
      - libglvnd-dev
      - libgl-dev
      - libgles2-mesa-dev
      - mesa-common-dev
      - python3-lxml
      - libxcb1-dev
      - libx11-dev
    override-build: |
      set -eux

      python3 external/fetch_sources.py

      mkdir build && cd build

      # Different archs need different buildflags; only set arch flags
      # when building natively to avoid passing host-incompatible -march.
      CMAKE_CLANG_FLAGS=""
      CMAKE_C_COMPILER=""
      CMAKE_CXX_COMPILER=""
      CMAKE_SYSTEM_PROCESSOR=""
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ] && [ "$CRAFT_ARCH_BUILD_ON" == "amd64" ]; then
          CMAKE_CLANG_FLAGS=-m64
      elif [ "$CRAFT_ARCH_BUILD_FOR" == "arm64" ] && [ "$CRAFT_ARCH_BUILD_ON" == "arm64" ]; then
          CMAKE_CLANG_FLAGS=-march=armv8-a
      elif [ "$CRAFT_ARCH_BUILD_FOR" == "arm64" ] && [ "$CRAFT_ARCH_BUILD_ON" == "amd64" ]; then
          CMAKE_CLANG_FLAGS=-march=armv8-a
          CMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          CMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          CMAKE_SYSTEM_PROCESSOR=aarch64
          dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          for f in /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64.list) continue ;;
            esac
            if ! grep -q "ubuntu-ports" "$f"; then
              sed -i 's/^deb /deb [arch=amd64] /' "$f"
            fi
          done
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if ! grep -q "ubuntu-ports" "$f"; then
              if grep -q "^Architectures:" "$f"; then
                sed -i 's/^Architectures:.*/Architectures: amd64/' "$f"
              else
                sed -i '/^URIs:/a Architectures: amd64' "$f"
              fi
            fi
          done
          printf '%s\n' \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update
          apt-get install -y libxcb1-dev:arm64 libx11-dev:arm64 libglvnd-dev:arm64 libgles2-mesa-dev:arm64
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      fi

      cmake .. -DCMAKE_BUILD_TYPE=Release \
        -DDEQP_TARGET=surfaceless \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_C_FLAGS="$CMAKE_CLANG_FLAGS" \
        -DCMAKE_CXX_FLAGS="$CMAKE_CLANG_FLAGS" \
        ${CMAKE_C_COMPILER:+-DCMAKE_C_COMPILER=$CMAKE_C_COMPILER} \
        ${CMAKE_CXX_COMPILER:+-DCMAKE_CXX_COMPILER=$CMAKE_CXX_COMPILER} \
        ${CMAKE_SYSTEM_PROCESSOR:+-DCMAKE_SYSTEM_PROCESSOR=$CMAKE_SYSTEM_PROCESSOR}
      make -j`nproc`

      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin/"
      cp "${SNAPCRAFT_PART_BUILD}/build/external/openglcts/modules/glcts" "${CRAFT_PART_INSTALL}/usr/bin/"

      # Copy required data files and mustpass lists
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/opengl-cts/"
      cp -r "${SNAPCRAFT_PART_BUILD}/external/openglcts/data" "${CRAFT_PART_INSTALL}/usr/share/opengl-cts/" || true
      cp -r "${SNAPCRAFT_PART_BUILD}/build/external/openglcts/modules/gl_cts" "${CRAFT_PART_INSTALL}/usr/share/opengl-cts/" || true
